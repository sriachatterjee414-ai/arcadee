<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5fb"><title>A little connection break · Mochi Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#fff5fb;color:#69496d;font:16px/1.6 ui-rounded,system-ui,sans-serif}main{width:min(100%,430px);padding:30px 24px;text-align:center;border:2px solid #d9bfdc;border-radius:30px;background:#fffdf9;box-shadow:0 7px #ead9ed}img{width:140px;height:140px;border-radius:30px}h1{font-size:27px;line-height:1.2}p{font-size:14px}button{padding:13px 24px;border:2px solid #69496d;border-radius:16px;background:#d9c9ed;color:#513769;font:700 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #8e68bf;outline-offset:4px}
</style>
</head>
<body><main><img src="/icons/mochi-192.png" alt="Mochi the rabbit"><h1>A little connection break</h1><p id="status" role="status">Mochi Arcade needs the internet to load games and connect with your friends. Reconnect, then try again.</p><button id="retry">Try again</button></main>
<script>
document.getElementById('retry').onclick=()=>location.replace('/');
addEventListener('online',()=>{document.getElementById('status').textContent='Your connection is back. Tap Try again to return to the arcade.'});
</script></body></html>
